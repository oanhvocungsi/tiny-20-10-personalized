<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="title desc">
<title id="title">Kẹo mút pastel dành cho Hương</title><desc id="desc">Kẹo mút xoắn ốc hồng, đào, vàng và kem với que kẹo và nơ nhỏ.</desc>
